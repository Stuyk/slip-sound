name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            builder-flags: --linux
          - os: windows-latest
            platform: windows
            builder-flags: --win

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck & Tests
        run: |
          bun run typecheck
          bun run test

      - name: Build Application
        run: bun run build

      - name: Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run electron-builder ${{ matrix.builder-flags }}

      - name: Generate SHA256 checksums
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          files=(*.AppImage *.deb *.tar.gz *-Setup.exe *-Portable.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found to checksum"
            exit 1
          fi
          sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.platform }}.txt"
          cat "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*-Setup.exe
            dist/*-Portable.exe
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
