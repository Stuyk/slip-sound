name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A new push to a PR cancels its stale run. Pushes to main are never cancelled
# mid-release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Typecheck, tests, and a compile check run once here instead of on every OS.
  verify:
    name: Typecheck, Test & Compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # No native runtime modules (node:sqlite is built in), so the
      # electron-builder install-app-deps postinstall has nothing to do.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Compile
        run: bunx electron-vite build

  check-version:
    name: Check package.json version
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine if this version has already been released
        id: check
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.os }})
    needs: [check-version, verify]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            builder-flags: --linux
          - os: windows-latest
            platform: windows
            builder-flags: --win
          - os: macos-latest
            platform: mac
            builder-flags: --mac

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Defender scanning every file bun and electron-builder write is a large
      # share of Windows build time. Exclude the workspace and tool caches.
      - name: Exclude build paths from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.bun"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Electron & electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # --ignore-scripts skips ffmpeg-static's binary download. Restore it from
      # cache, then run its installer, which exits early if the binary exists.
      - name: Cache ffmpeg-static binary
        uses: actions/cache@v4
        with:
          path: node_modules/ffmpeg-static/ffmpeg*
          key: ${{ runner.os }}-ffmpeg-${{ hashFiles('bun.lock') }}

      - name: Install ffmpeg-static binary
        shell: bash
        run: |
          node node_modules/ffmpeg-static/install.js
          ls node_modules/ffmpeg-static/ffmpeg node_modules/ffmpeg-static/ffmpeg.exe 2>/dev/null | grep -q . \
            || { echo "::error::ffmpeg binary missing"; exit 1; }

      - name: Build Application
        run: bunx electron-vite build

      - name: Package with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bun run electron-builder ${{ matrix.builder-flags }} --publish never

      - name: List dist contents
        shell: bash
        run: ls -la dist

      - name: Sanity-check artifact sizes
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.AppImage *.deb *.tar.gz *.exe *.dmg *.zip; do
            [[ "$f" == *__uninstaller.exe ]] && continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is only $size bytes — build likely corrupted"
              exit 1
            fi
          done

      - name: Generate SHA256 checksums
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          for f in *.AppImage *.deb *.tar.gz *.exe *.dmg *.zip; do
            [[ "$f" == *__uninstaller.exe ]] && continue
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found to checksum"
            exit 1
          fi
          sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.platform }}.txt"
          cat "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slip-sound-${{ matrix.platform }}-binaries
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            !dist/*__uninstaller.exe
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should_release == 'true'
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: slip-sound-*-binaries
          path: dist
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la dist

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            !dist/*__uninstaller.exe
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
