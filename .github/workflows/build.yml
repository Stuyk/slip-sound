name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            builder-flags: --linux
          - os: windows-latest
            platform: windows
            builder-flags: --win

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Run Unit Tests
        run: bun run test

      - name: Build Application with electron-vite
        run: bun run build

      - name: Exclude dist from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\dist"

      - name: Package Application with electron-builder
        run: bun run electron-builder ${{ matrix.builder-flags }} --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slip-sound-${{ matrix.platform }}-binaries
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*-Setup.exe
            dist/*-Portable.exe
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 14
